

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc)}
.calculator{width:330px;padding:22px;background:white;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.title{text-align:center;font-size:20px;font-weight:bold;color:#202638;margin-bottom:18px}
.display{width:100%;height:80px;border:0;border-radius:16px;background:#f1f4f9;padding:15px;margin-bottom:16px;text-align:right;font-size:32px;color:#202638}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:58px;border:0;border-radius:15px;font-size:20px;font-weight:bold;cursor:pointer;background:#f0f2f6;color:#242938}
button:active{transform:scale(.94)}
.operator{background:#e7eaff;color:#4b55c5}
.clear{background:#ffe8e8;color:#d94a4a}
.equals{background:#5b63d3;color:white}
</style>
</head>
<body>
<div class="calculator">
<div class="title">Calculator</div>
<input id="display" class="display" value="0" readonly>
<div class="buttons">
<button class="clear" data-action="clear">AC</button>
<button data-action="delete">⌫</button>
<button class="operator" data-value="%">%</button>
<button class="operator" data-value="/">÷</button>
<button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button>
<button class="operator" data-value="*">×</button>
<button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button>
<button class="operator" data-value="-">−</button>
<button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button>
<button class="operator" data-value="+">+</button>
<button data-value="0">0</button><button data-value=".">.</button>
<button class="equals" data-action="equals">=</button>
</div>
</div>
<script>
const display=document.getElementById("display");
let expression="";

document.querySelectorAll("button").forEach(button=>{
  button.addEventListener("click",()=>{
    const value=button.dataset.value;
    const action=button.dataset.action;

    if(action==="clear"){expression="";display.value="0";return}
    if(action==="delete"){expression=expression.slice(0,-1);display.value=expression||"0";return}
    if(action==="equals"){calculate();return}

    if(value){
      if("+-*/%".includes(value)){
        if(!expression)return;
        if("+-*/%".includes(expression.slice(-1))) expression=expression.slice(0,-1);
      }
      if(value==="." && expression.split(/[+\-*/%]/).pop().includes("."))return;
      expression+=value;
      display.value=expression.replaceAll("*","×").replaceAll("/","÷");
    }
  });
});

function calculate(){
  if(!expression)return;
  try{
    if(!/^[0-9+\-*/%.]+$/.test(expression))throw Error();
    let result=Function("return "+expression)();
    if(!Number.isFinite(result))throw Error();
    expression=String(result);
    display.value=expression;
  }catch(e){
    expression="";
    display.value="Error";
  }
}

document.addEventListener("keydown",e=>{
  if(/[0-9.]/.test(e.key)) document.querySelector(`[data-value="${e.key}"]`)?.click();
  else if("+-*/%".includes(e.key)) document.querySelector(`[data-value="${e.key}"]`)?.click();
  else if(e.key==="Enter"||e.key==="=") document.querySelector('[data-action="equals"]').click();
  else if(e.key==="Backspace") document.querySelector('[data-action="delete"]').click();
  else if(e.key==="Escape") document.querySelector('[data-action="clear"]').click();
});
</script>
</body>
</html>
